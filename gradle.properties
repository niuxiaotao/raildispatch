# Version and metadata source of truth.
#
# There is deliberately no build.gradle: Gradle is unusable in this environment (no network, empty
# ~\.gradle\caches, so the moddevgradle and foojay plugins and the whole neoform pipeline cannot be
# fetched), and an untested Gradle script would only mislead. `tools\build-offline.ps1` reads this
# file twice over: for the mod metadata, and as the source of the ${placeholder} values it substitutes
# into neoforge.mods.toml and the language files, which is what Gradle's processResources would do.
# The plugin/version keys at the bottom are kept because a networked Gradle build would need exactly
# those coordinates.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Mod metadata ---
mod_id=raildispatch
mod_name=Aeronautics Rail Dispatch
mod_version=0.1.0
mod_group=com.raildispatch
mod_authors=raildispatch
mod_description=Train-style automation (schedules, an autopilot console, signals, switches, tagging) for physics vehicles.

# --- Target platform (matches the "CRA 6月20号物理火车包" instance) ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.233
neo_version_range=[21.1.233,)
loader_version_range=[4,)

# --- Hard dependencies (verified present in the target instance) ---
create_version=6.0.10
create_version_range=[6.0.10,)
aeronautics_version=1.3.0
sable_version=2.0.5
# Physics bogies and automatic couplers. Simurail 0.1.0 is the version this mod is written against:
# it is the first release with the remote-override and coupler-partner APIs used in physics\.
# 0.0.0 exposed a different, incompatible surface (public double override fields, setPartner), so the
# mod deliberately refuses to load there instead of failing at runtime with NoSuchMethodError.
simurail_version_range=[0.1.0,)
# The remote bogey override API arrived with Sable 2.0.5 in the Simurail release this targets.
sable_version_range=[2.0.5,)
# Track switches live in Create: Railways, which is optional for us.
railways_version_range=[0,)
# Traction/brake leave through Drive By Wire channels; both control blocks implement its channel
# interface, so the mod cannot load without it.
drivebywire_version_range=[0.2.0,)

# --- Companion libraries of Create (needed on a networked Gradle build) ---
registrate_version=MC1.21-1.3.0+67
flywheel_version=1.0.4
ponder_version=1.0.59
